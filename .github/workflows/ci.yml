name: Build and Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit and integration tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./client ./internal/idsauth ./internal/session ./internal/tunnel ./internal/l3
      - name: Static analysis
        run: go vet ./...
      - name: Build packages
        run: go build ./...
